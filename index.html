<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anonymous Function </title>
</head>
<body>
<button id="bgRed">Make Background Red</button>
<button id="bgWhite">White Background, Red Text</button>
<hr>
<script>
    function makeBackgroundRed() {
        document.body.style.backgroundColor = "red";
    }
    function makeBackgroundWhite() {
        document.body.style.backgroundColor = "white";
    }
    document.getElementById("bgRed").addEventListener("click", makeBackgroundRed);
    document.getElementById("bgWhite").addEventListener("click", makeBackgroundWhite);
</script>
</body>
</html>
