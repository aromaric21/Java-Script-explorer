<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> So Many Kale Recipes </title>
</head>
<body>
<header id="page-banner">
    <h1>Above and Beyond the kale of Duty</h1>
</header>
<main id="page-content">
    <h2 id="nav-heading">Navigation</h2>
    <p>
        Do you love to cook with <a href="kale.html">kale</a>?
    </p>
    <img id="header-image" src="mangosteen.jpeg" alt="Drawing of a mangosteen">

    <div id="my-div"></div>
    <button id="my-button">Click to add some text, above</button>

    <div> Type a key: </div>
    <input id="key-input" type="text">
    <div>
        Here's the code of the key you pressed:
    </div>
    <div id="key-output">
    </div>
</main>
    <script>
        const newArticle = document.createElement("article");
        document.querySelector("main").append(newArticle);

        const newNav = document.createElement("nav");
        document.querySelector("main").prepend(newNav);
        newNav.innerHTML = "<h2>Navigation</h2>";

        const navHeading = document.getElementById("nav-heading");
        navHeading.insertAdjacentText("afterbegin", "Main ");

        const pageTitle = document.querySelector("h1");
        pageTitle.style.fontSize = "64px";
        pageTitle.style.color = "maroon";
        pageTitle.style.textAlign = "center";
        pageTitle.style.border ="1px solid black";

        const headerImage = document.getElementById("header-image");
        headerImage.setAttribute("alt", "Lithograph of a mangosteen");

        const myButton = document.getElementById('my-button');
        myButton.addEventListener('click', function() {
            const myDiv = document.
            getElementById('my-div');
            myDiv.innerHTML = '<h1>Hello Click World!</h1>';
        });

        document.addEventListener('DOMContentLoaded',
            function() {
                console.log('We are loaded!');
            });

        const keyInput = document.getElementById('key-input');
        keyInput.addEventListener('keypress', function(e)
        {
            const keyOutput = document.
            getElementById('key-output');
            keyOutput.innerHTML = e.which;
        });
    </script>
</body>
</html>
