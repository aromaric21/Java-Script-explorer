<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calling the function in response to an event</title>

    <script>
        function makeBackgroundRed(){
            document.body.style.backgroundColor = "red";
        }
        function makeBackgroundWhite(){
            document.body.style.backgroundColor = "white";
        }
    </script>
</head>
<body>
<!-- Other body elements go here -->
<button onclick="makeBackgroundRed()">Make Background Red</button>
<button onclick="makeBackgroundWhite()">Make Background White</button>
<hr>
<footer>
    <script src="footer.js">
    </script>
</footer>
</body>
</html>
