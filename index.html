<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anonymous Function </title>
</head>
<body>
<button id="bgRed">Make Background Red</button>
<button id="bgWhite">White Background, Red Text</button>
<hr>
<script>

    document.getElementById("bgRed").addEventListener("click", function() {
        document.body.style.backgroundColor = "red";
    });
    document.getElementById("bgWhite").addEventListener("click", function() {
        document.body.style.backgroundColor = "white";
    });
</script>
</body>
</html>
