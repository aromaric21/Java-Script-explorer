<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Passing multiple values to the function</title>

    <script>
        function changeColors(newBackColor, newForeColor){
            document.body.style.backgroundColor = newBackColor;
            document.body.style.backgroundColor = newForeColor;
        }
    </script>
</head>
<body>
<!-- Other body elements go here -->
<h1>Passing multiple values to the function</h1>
<button onclick="changeColors('red', 'white')">Red Background, White Text</button>
<button onclick="changeColors('white', 'red')">White Background, Red Text</button>
<hr>
<script src="script1.js"></script>
</body>
</html>
